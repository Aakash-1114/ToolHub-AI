<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image to PDF - ToolHub AI</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

    <link rel="stylesheet" href="style.css">

</head>

<body class="text-white">

    <nav class="bg-slate-900 p-5 flex justify-between">

        <h1 class="text-2xl font-bold text-blue-500">
            <i class="fa-solid fa-file-image text-blue-500 mr-2"></i>

            Image to PDF
        </h1>

        <a href="../../dashboard.html" class="text-gray-300 hover:text-blue-400">

            ⬅ Dashboard

        </a>

    </nav>

    <div class="max-w-5xl mx-auto p-8">

        <h2 class="page-title">

            Image to PDF

        </h2>

        <p class="page-subtitle">

            Merge multiple images into one professional PDF document.

        </p>

        <div class="upload-card">

            <input type="file" id="imageInput" multiple accept="image/*" hidden>

            <label for="imageInput" id="dropZone" class="upload-zone">

                <div class="upload-icon">

                    <i class="fa-solid fa-cloud-arrow-up"></i>

                </div>

                <h2>

                    Drag & Drop Images

                </h2>

                <p>

                    or Click to Browse

                </p>

                <span>

                    PNG • JPG • JPEG • WEBP

                </span>

                <div class="flex justify-center gap-4 mt-6">

                    <button type="button" class="camera-btn" onclick="openCamera()">

                        <i class="fa-solid fa-camera"></i>

                        Take Photo

                    </button>

                    <button type="button" class="gallery-btn" onclick="openGallery()">

                        <i class="fa-solid fa-images"></i>

                        Choose Gallery

                    </button>

                </div>

            </label>

        </div>

        <div class="settings-card">

            <h2 class="settings-title">

                ⚙ PDF Settings

            </h2>

            <div class="grid md:grid-cols-2 gap-4 mt-6">

                <div>

                    <label class="font-semibold block mb-2">

                        📄 Page Size

                    </label>

                    <select id="pageSize" class="w-full rounded bg-slate-900 p-3">

                        <option value="a4">

                            A4

                        </option>

                        <option value="letter">

                            Letter

                        </option>

                    </select>

                </div>

                <div>

                    <label class="font-semibold block mb-2">

                        📐 Orientation

                    </label>

                    <select id="orientation" class="w-full rounded bg-slate-900 p-3">

                        <option value="portrait">

                            Portrait

                        </option>

                        <option value="landscape">

                            Landscape

                        </option>

                    </select>

                </div>

            </div>

            <div class="grid md:grid-cols-2 gap-4 mt-4">

                <div>

                    <label class="font-semibold block mb-2">

                        🖼 Fit Mode

                    </label>

                    <select id="fitMode" class="w-full rounded bg-slate-900 p-3">

                        <option value="fit">

                            Fit

                        </option>

                        <option value="fill">

                            Fill

                        </option>

                    </select>

                </div>

                <div>

                    <label class="font-semibold block mb-2">

                        ⚡ Image Quality

                    </label>

                    <select id="quality" class="w-full rounded bg-slate-900 p-3">

                        <option value="1">

                            High

                        </option>

                        <option value="0.8">

                            Medium

                        </option>

                        <option value="0.6">

                            Low

                        </option>

                    </select>

                </div>

            </div>

            <div class="counter-card">

                <div>

                    <h3>Images</h3>

                    <span>Ready to Convert</span>

                </div>

                <div class="counter-right">

                    <div id="imageCount">

                        0

                    </div>

                    <button id="removeAllBtn">

                        <i class="fa-solid fa-trash"></i>

                        Remove All

                    </button>

                </div>

            </div>

            <div id="preview" class="grid grid-cols-3 md:grid-cols-4 xl:grid-cols-5 gap-3 mt-6">
            </div>

            <div id="progressContainer">

                <div class="progress-info">

                    <span>Generating PDF...</span>

                    <span id="progressPercent">

                        0%

                    </span>

                </div>

                <div class="progress-bar">

                    <div id="progressFill"></div>

                </div>

            </div>

        </div> <!-- settings-card -->

    </div> <!-- max-w-5xl -->

    <div id="imagePreviewModal" class="preview-modal">

        <span class="close-preview" onclick="closeImagePreview()">
            &times;
        </span>

        <button class="preview-nav left" onclick="prevImage()">
            <i class="fa-solid fa-chevron-left"></i>
        </button>

        <img id="previewImage" class="preview-image" alt="Preview Image">

        <div class="preview-toolbar">

            <button id="rotateLeftPreview" aria-label="Rotate Left"> <i class="fa-solid fa-rotate-left"></i>
            </button>

            <button id="rotateRightPreview" aria-label="Rotate Right"> <i class="fa-solid fa-rotate-right"></i>
            </button>

            <button id="deletePreview" aria-label="Delete Image"> <i class="fa-solid fa-trash"></i>
            </button>

            <button type="button" onclick="closeImagePreview()" aria-label="Close Preview"> <i class="fa-solid fa-xmark"></i>
            </button>

        </div>

        <button class="preview-nav right" aria-label="Next Image" onclick="nextImage()">
            <i class="fa-solid fa-chevron-right"></i>
        </button>

        <div id="previewCounter" class="preview-counter">
            1 / 1
        </div>

    </div>

    <div id="toast" class="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="script.js"></script>


</body>

</html>
